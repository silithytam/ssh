name: CI

on: [push, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Download ngrok
      run: |
        wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        tar xvzf ngrok-v3-stable-linux-amd64.tgz
        chmod +x ngrok
    
    - name: Auth ngrok
      run: ./ngrok authtoken 38QoAt2SSo3dyCzDBOq79rHGrnY_2tGwKsK3xpfTgNMp3seWY
    
    - name: Install Desktop Environment
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          xfce4 xfce4-goodies \
          dbus-x11 \
          firefox \
          wget \
          jq
    
    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb
    
    - name: Install Chrome Remote Desktop
      run: |
        wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
        sudo apt-get install -y ./chrome-remote-desktop_current_amd64.deb
        rm chrome-remote-desktop_current_amd64.deb
    
    - name: Configure Chrome Remote Desktop
      run: |
        sudo usermod -a -G chrome-remote-desktop runner
        echo "export CHROME_REMOTE_DESKTOP_DEFAULT_DESKTOP_SIZES=1920x1080" >> ~/.profile
        bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > ~/.chrome-remote-desktop-session'
        sudo systemctl disable lightdm.service || true
    
    - name: Setup XRDP (Fallback)
      run: |
        sudo apt-get install -y xrdp
        sudo systemctl start xrdp
        sudo systemctl enable xrdp
        sudo adduser xrdp ssl-cert
        echo "xfce4-session" > ~/.xsession
        sudo sed -i 's/^new_cursors=true/new_cursors=false/g' /etc/xrdp/xrdp.ini
        sudo systemctl restart xrdp
    
    - name: Set User Password
      run: |
        echo "runner:P@ssw0rd!" | sudo chpasswd
    
    - name: Start ngrok and display URL
      run: |
        ./ngrok tcp 3389 > /dev/null &
        sleep 10
        
        NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
        NGROK_HOST=$(echo $NGROK_URL | sed 's|tcp://||' | cut -d':' -f1)
        NGROK_PORT=$(echo $NGROK_URL | sed 's|tcp://||' | cut -d':' -f2)
        
        echo "=========================================="
        echo "RDP Connection Info:"
        echo "Host: $NGROK_HOST"
        echo "Port: $NGROK_PORT"
        echo "Username: runner"
        echo "Password: P@ssw0rd!"
        echo ""
        echo "=== Chrome Remote Desktop Setup ==="
        echo "1. Connect via RDP first using info above"
        echo "2. Open Chrome browser in RDP session"
        echo "3. Go to: remotedesktop.google.com/headless"
        echo "4. Click 'Begin' and 'Next'"
        echo "5. Copy the Debian Linux command"
        echo "6. Run it in terminal to get PIN setup"
        echo ""
        echo "=== RDP Connection Commands ==="
        echo "Windows: Use Remote Desktop Connection"
        echo "Linux: xfreerdp /v:$NGROK_HOST:$NGROK_PORT /u:runner /p:P@ssw0rd!"
        echo "Mac: Use Microsoft Remote Desktop"
        echo "=========================================="
        
        sleep 6h
